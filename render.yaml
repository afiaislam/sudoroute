# One-click public deployment on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: sudoroute
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TS_SECRET
        generateValue: true
      - key: TS_SECURE_COOKIES
        value: "1"
      - key: GEMINI_API_KEY
        sync: false   # optional: paste your key in the Render dashboard, never in the repo
